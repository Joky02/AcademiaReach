services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TAOCI_ALLOWED_ORIGINS: ${TAOCI_ALLOWED_ORIGINS:-http://localhost:5173}
      TAOCI_CODEX_SOCKET: /run/taoci-codex/worker.sock
      TAOCI_PI_SOCKET: /run/taoci-pi/worker.sock
    volumes:
      - ${TAOCI_CONFIG_DIR:-./backend/config}:/app/backend/config
      - ${TAOCI_DATA_DIR:-./backend/data}:/app/backend/data
      - ${TAOCI_CODEX_SOCKET_DIR:-/tmp/taoci-codex-1000}:/run/taoci-codex
      - ${TAOCI_PI_SOCKET_DIR:-/tmp/taoci-pi-1000}:/run/taoci-pi
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  pi-worker:
    build:
      context: .
      dockerfile: pi_worker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TAOCI_PI_CONCURRENCY: ${TAOCI_PI_CONCURRENCY:-4}
    volumes:
      - ${TAOCI_PI_SOCKET_DIR:-/tmp/taoci-pi-1000}:/run/taoci-pi
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:2026.7.1
    user: ${CLOUDFLARED_USER:-1000:1000}
    restart: unless-stopped
    profiles:
      - tunnel
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ${CLOUDFLARED_CONFIG_FILE:-./deploy/cloudflare/config.yml}:/etc/cloudflared/config.yml:ro
    secrets:
      - tunnel_credentials
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run

secrets:
  tunnel_credentials:
    file: ${CLOUDFLARED_CREDENTIALS_FILE:-./deploy/cloudflare/tunnel-credentials.json}
